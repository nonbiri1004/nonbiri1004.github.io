<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      .sans { font-family: "PingFang TC", "Helvetica Neue", Helvetica, Arial, sans-serif; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="630" fill="#FAF7F2"/>

  <!-- soft accent block, top-right -->
  <rect x="880" y="0" width="320" height="630" fill="#F2EBE0"/>
  <circle cx="1040" cy="315" r="120" fill="#F5E6D4"/>
  <circle cx="1040" cy="315" r="120" fill="none" stroke="#E0D0BC" stroke-width="2"/>
  <text x="1040" y="315" class="sans" font-size="150" font-weight="700"
        fill="#C8612A" text-anchor="middle" dominant-baseline="central" letter-spacing="-4">J</text>

  <!-- eyebrow pill -->
  <rect x="90" y="104" width="392" height="48" rx="24" fill="#F5E6D4"/>
  <text x="286" y="128" class="sans" font-size="21" font-weight="500"
        fill="#C8612A" text-anchor="middle" dominant-baseline="central">Full-Stack Developer · C# / Vue</text>

  <!-- name -->
  <text x="90" y="290" class="sans" font-size="128" font-weight="700"
        fill="#1C1510" letter-spacing="-5">Jay.</text>
  <rect x="90" y="308" width="228" height="8" rx="4" fill="#C8612A"/>

  <!-- tagline -->
  <text x="90" y="392" class="sans" font-size="31" font-weight="400" fill="#7A6558">從資料庫設計一路寫到前端畫面</text>

  <!-- tech chips -->
  <g class="sans" font-size="22" font-weight="500">
    <rect x="90"  y="470" width="82"  height="50" rx="10" fill="#FAF7F2" stroke="#E0D0BC" stroke-width="2"/>
    <text x="131" y="495" fill="#1C1510" text-anchor="middle" dominant-baseline="central">C#</text>

    <rect x="188" y="470" width="190" height="50" rx="10" fill="#FAF7F2" stroke="#E0D0BC" stroke-width="2"/>
    <text x="283" y="495" fill="#1C1510" text-anchor="middle" dominant-baseline="central">ASP.NET Core</text>

    <rect x="394" y="470" width="110" height="50" rx="10" fill="#FAF7F2" stroke="#E0D0BC" stroke-width="2"/>
    <text x="449" y="495" fill="#1C1510" text-anchor="middle" dominant-baseline="central">Vue 3</text>

    <rect x="520" y="470" width="158" height="50" rx="10" fill="#FAF7F2" stroke="#E0D0BC" stroke-width="2"/>
    <text x="599" y="495" fill="#1C1510" text-anchor="middle" dominant-baseline="central">SQL Server</text>
  </g>

  <!-- url -->
  <text x="90" y="576" class="sans" font-size="22" font-weight="400" fill="#7A6558">nonbiri1004.github.io</text>
</svg>
