<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t">
  <title id="t">節點式 AI 創作工具示意圖：素材、指令、生圖、生影片、輸出用連線串成流程</title>
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#e0d0bc"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1c1510" flood-opacity="0.10"/>
    </filter>
  </defs>

  <!-- 畫布底 -->
  <rect width="1200" height="675" fill="#faf7f2"/>
  <rect width="1200" height="675" fill="url(#dots)"/>

  <!-- 連線（先畫，壓在節點下面） -->
  <g fill="none" stroke="#c8612a" stroke-width="4" stroke-linecap="round">
    <path d="M300 205 C 360 205, 360 330, 420 330"/>
    <path d="M300 465 C 360 465, 360 345, 420 345"/>
    <path d="M640 330 C 700 330, 700 215, 760 215"/>
    <path d="M640 345 C 700 345, 700 460, 760 460"/>
    <path d="M980 215 C 1010 215, 1010 330, 1010 330" stroke="#e0d0bc" stroke-dasharray="2 12"/>
    <path d="M980 460 C 1010 460, 1010 345, 1010 345" stroke="#e0d0bc" stroke-dasharray="2 12"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'PingFang TC', 'Segoe UI', sans-serif">
    <!-- 素材 -->
    <g filter="url(#shadow)">
      <rect x="80" y="140" width="220" height="130" rx="16" fill="#ffffff" stroke="#e0d0bc" stroke-width="2"/>
    </g>
    <rect x="80" y="140" width="220" height="40" rx="16" fill="#f2ebe0"/>
    <rect x="80" y="164" width="220" height="16" fill="#f2ebe0"/>
    <text x="100" y="167" font-size="18" font-weight="600" fill="#1c1510">素材</text>
    <rect x="100" y="196" width="56" height="56" rx="8" fill="#f5e6d4"/>
    <rect x="164" y="196" width="56" height="56" rx="8" fill="#f5e6d4"/>
    <rect x="228" y="196" width="52" height="56" rx="8" fill="#f5e6d4"/>
    <circle cx="300" cy="205" r="9" fill="#c8612a" stroke="#fff" stroke-width="3"/>

    <!-- 指令 -->
    <g filter="url(#shadow)">
      <rect x="80" y="400" width="220" height="130" rx="16" fill="#ffffff" stroke="#e0d0bc" stroke-width="2"/>
    </g>
    <rect x="80" y="400" width="220" height="40" rx="16" fill="#f2ebe0"/>
    <rect x="80" y="424" width="220" height="16" fill="#f2ebe0"/>
    <text x="100" y="427" font-size="18" font-weight="600" fill="#1c1510">指令</text>
    <rect x="100" y="458" width="170" height="10" rx="5" fill="#e0d0bc"/>
    <rect x="100" y="478" width="130" height="10" rx="5" fill="#e0d0bc"/>
    <rect x="100" y="498" width="150" height="10" rx="5" fill="#e0d0bc"/>
    <circle cx="300" cy="465" r="9" fill="#c8612a" stroke="#fff" stroke-width="3"/>

    <!-- 生圖（中間，主角） -->
    <g filter="url(#shadow)">
      <rect x="420" y="250" width="220" height="175" rx="16" fill="#ffffff" stroke="#c8612a" stroke-width="3"/>
    </g>
    <rect x="420" y="250" width="220" height="40" rx="16" fill="#c8612a"/>
    <rect x="420" y="274" width="220" height="16" fill="#c8612a"/>
    <text x="440" y="277" font-size="18" font-weight="600" fill="#ffffff">生成圖片</text>
    <rect x="440" y="306" width="180" height="96" rx="8" fill="#f5e6d4"/>
    <path d="M452 390 L500 340 L532 370 L560 345 L608 390 Z" fill="#e8b48f"/>
    <circle cx="590" cy="326" r="10" fill="#c8612a" opacity="0.6"/>
    <circle cx="420" cy="337" r="9" fill="#c8612a" stroke="#fff" stroke-width="3"/>
    <circle cx="640" cy="337" r="9" fill="#c8612a" stroke="#fff" stroke-width="3"/>

    <!-- 生影片 -->
    <g filter="url(#shadow)">
      <rect x="760" y="150" width="220" height="130" rx="16" fill="#ffffff" stroke="#e0d0bc" stroke-width="2"/>
    </g>
    <rect x="760" y="150" width="220" height="40" rx="16" fill="#f2ebe0"/>
    <rect x="760" y="174" width="220" height="16" fill="#f2ebe0"/>
    <text x="780" y="177" font-size="18" font-weight="600" fill="#1c1510">生成影片</text>
    <rect x="780" y="204" width="180" height="56" rx="8" fill="#1c1510"/>
    <path d="M860 220 L884 232 L860 244 Z" fill="#faf7f2"/>
    <circle cx="760" cy="215" r="9" fill="#c8612a" stroke="#fff" stroke-width="3"/>

    <!-- 輸出 -->
    <g filter="url(#shadow)">
      <rect x="760" y="395" width="220" height="130" rx="16" fill="#ffffff" stroke="#e0d0bc" stroke-width="2"/>
    </g>
    <rect x="760" y="395" width="220" height="40" rx="16" fill="#f2ebe0"/>
    <rect x="760" y="419" width="220" height="16" fill="#f2ebe0"/>
    <text x="780" y="422" font-size="18" font-weight="600" fill="#1c1510">輸出</text>
    <rect x="780" y="452" width="80" height="54" rx="8" fill="#f5e6d4"/>
    <rect x="870" y="452" width="90" height="24" rx="6" fill="#e0d0bc"/>
    <rect x="870" y="482" width="64" height="24" rx="6" fill="#e0d0bc"/>
    <circle cx="760" cy="460" r="9" fill="#c8612a" stroke="#fff" stroke-width="3"/>

    <!-- 左上角小標籤 -->
    <rect x="80" y="60" width="176" height="40" rx="20" fill="#f5e6d4"/>
    <text x="104" y="87" font-size="17" font-weight="500" fill="#c8612a">本機模型 ⇄ 雲端 API</text>
  </g>
</svg>
